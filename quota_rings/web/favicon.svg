<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1426"/><stop offset="1" stop-color="#07070c"/>
    </linearGradient>
    <linearGradient id="o" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3d6e"/><stop offset=".5" stop-color="#ffb15c"/><stop offset="1" stop-color="#e07a5a"/>
    </linearGradient>
    <linearGradient id="i" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cf2c9"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <g transform="rotate(-90 32 32)" fill="none" stroke-linecap="round" filter="url(#glow)">
    <circle cx="32" cy="32" r="22" stroke="#ffffff" stroke-opacity=".08" stroke-width="6"/>
    <circle cx="32" cy="32" r="13" stroke="#ffffff" stroke-opacity=".08" stroke-width="5"/>
    <circle cx="32" cy="32" r="22" stroke="url(#o)" stroke-width="6" stroke-dasharray="103.7 138.2"/>
    <circle cx="32" cy="32" r="13" stroke="url(#i)" stroke-width="5" stroke-dasharray="62 81.7"/>
  </g>
  <circle cx="32" cy="32" r="2.6" fill="#fff"/>
</svg>
